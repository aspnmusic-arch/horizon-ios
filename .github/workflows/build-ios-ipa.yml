name: Build private Horizon iOS IPA

on:
  push:
    branches: [codex/build-ios-ipa]
    paths: [.github/workflows/build-ios-ipa.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 360
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - name: Prepare Minecraft resources
        run: |
          python3 tools/ios/fetch_minecraft.py
          cargo build --profile fast -p horizon-prepare
          ./target/fast/horizon-prepare --prepare --complete \
            --minecraft-dir .local/mojang \
            --server-jar .local/mojang/server/server-26.3.jar \
            --java-home "$JAVA_HOME" --root "$PWD"
      - name: Build the iPhone application
        run: tools/ios/build_app.sh --device
      - name: Package IPA
        run: |
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          ditto target/ios/aarch64-apple-ios/Horizon.app "$RUNNER_TEMP/ipa/Payload/Horizon.app"
          cd "$RUNNER_TEMP/ipa"
          zip -qry "$RUNNER_TEMP/Horizon.ipa" Payload
      # Public repository artifacts are downloadable by anyone with read access.
      # The IPA is encrypted before upload for the matching private certificate.
      - name: Encrypt the IPA for the repository owner
        env:
          CERT_DER_B64: 
        run: |
          python3 -c 'import base64, os, ssl, pathlib; pathlib.Path(os.environ["RUNNER_TEMP"], "recipient.pem").write_text(ssl.DER_cert_to_PEM_cert(base64.b64decode(os.environ["CERT_DER_B64"])))'
          "$(brew --prefix openssl@3)/bin/openssl" cms -encrypt -aes-256-cbc -binary \
            -in "$RUNNER_TEMP/Horizon.ipa" -outform DER \
            -out Horizon.ipa.p7m "$RUNNER_TEMP/recipient.pem"
      - uses: actions/upload-artifact@v4
        with:
          name: horizon-ios-ipa-cifrada
          path: Horizon.ipa.p7m
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
